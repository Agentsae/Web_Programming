<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area and Perimeter Calculator</title>
</head>
<body>

    <h1>Rectangle Area and Perimeter Calculator</h1>

    <label for="length">Length:</label>
    <input type="number" id="length" name="length"><br><br>

    <label for="width">Width:</label>
    <input type="number" id="width" name="width"><br><br>

    <button onclick="calculate()">Calculate</button>

    <h2 id="result">Output</h2>

    <p>Area Of Rectangle: <span id="area"></span></p>
    <p>Perimeter Of Rectangle: <span id="perimeter"></span></p>

    <script>
        function calculate() {
            var length = parseFloat(document.getElementById("length").value);
            var width = parseFloat(document.getElementById("width").value);

            if (isNaN(length) || isNaN(width)) {
                document.getElementById("result").innerText = "Please enter valid numbers for length and width.";
                return;
            }

            var area = length * width;
            var perimeter = 2 * (length + width);

            document.getElementById("area").innerText = area;
            document.getElementById("perimeter").innerText = perimeter;
        }
    </script>
</body>
</html>
