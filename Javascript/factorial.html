<!DOCTYPE html>

<html>

    <body>
        Enter a number: <input type="text" id="number"><br>
        <script>
            function factorial(n) {
                if (n === 0 || n === 1) {
                    return 1;
                } else if (n > 1) {
                    for (let i = n - 1; i > 0; i--) {
                        n *= i;
                    }
                    return n;
                }
            }

            console.log(factorial(10)); 

            function recursiveFactorial(n) {
                if (n === 0 || n === 1) 
                    return 1;
                    return n * recursiveFactorial(n - 1);            
            }    

            console.log(recursiveFactorial(1)); 
        </script>

    </body>
</html>
