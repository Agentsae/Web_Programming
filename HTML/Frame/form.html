<!DOCTYPE html>

<html>

    <head>
        <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <title>
            Form Sample
        </title>

        <style>

            /* Membuat container agar kita bisa memposisikan ikon di dalamnya */
            .password-container {
            position: relative;
            width: 300px;}
            /* Sesuaikan lebar sesuai kebutuhan */

             #password {
            width: 100%;
            padding-right : 40px;
            box-sizing :border-box;
             }

            .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #555;
            }
        </style>
    </head>

    <body>
        <form>
            <fieldset>
                <legend>Registration Form</legend>
                    <label for="name">Name  :</label>
                    <input type="text" id="name" name="name" autofocus required/><br><br>
                    <label for="age">Age     :</label>
                    <input type="number" id="age" name="age" min="1" max="100" required/>
                    <a>Years</a><br><br>
                    <label for="email">E-mail :</label>
                    <input type="email" id="email" name="email" class="email-width" required/><br><br>
                    <a>Make Your Password Below</a><br><br>
                    <div class="password-container">
                        <input type="password" id="password" name="password" value="secret" required/>
                            <!-- 2. Tambahkan ikon mata dari Font Awesome -->
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                    </div><br><br>
                   
                    <input type="submit" value="next"/>
            </fieldset>
        </form>

        <script>
            // 3. JavaScript untuk fungsionalitas toggle
            const togglePassword = document.querySelector('#togglePassword');
            const password = document.querySelector('#password');

            togglePassword.addEventListener('click', function (e) {
            // Mengubah tipe input dari password ke text atau sebaliknya
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
    
            // Mengubah ikon mata (dari 'eye' menjadi 'eye-slash')
            this.classList.toggle('fa-eye-slash');
        });
</script>
    </body>
</html>
