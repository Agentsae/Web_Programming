            Hello guys Kawai AEON Mall Deltamas is a newly opened music hub offering piano sales, 
            practice rooms, and music education in a vibrant, modern setting.
            Located on the second floor of AEON Mall Deltamas—the largest AEON Mall in Southeast 
            Asia—Kawai’s new store brings the brand’s renowned Japanese craftsmanship to Indonesia. 
            Officially opened on May 8, 2024, the store offers a full musical experience: 
            customers can purchase high-quality pianos, rent soundproof practice rooms, or enroll in music lessons at the in-house school. 
            The launch event featured live piano performances and highlighted Kawai’s commitment to nurturing musical culture in Indonesia. 
            AEON Mall Deltamas itself is a destination that blends nature, futuristic design, Japanese aesthetics, and entertainment, 
            making it an ideal location for Kawai’s immersive musical space.
