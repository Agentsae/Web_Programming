<!DOCTYPE html>
<html>

    <head>

        <title>
            Data List Sample
        </title>
    </head>

        <body>

            <form>
                <input list="country" id="countryname" name="countryname"/>

                <datalist id="country">
                    <option value="zimbabwe">
                    <option value="hongkong">
                    <option value="venezuela">
                    <option value="uruguay">
                    <option value="panama">
                    <option value="Indonesia">

                </datalist>

                <input type="submit" value="submit form"/>
            </form>
        </body>
</html>
